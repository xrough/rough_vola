[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rough-vola"
version = "0.1.0"
description = "Python research tools for stochastic and rough volatility, option pricing, and calibration"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
]

[project.urls]
Repository = "https://github.com/xrough/rough_vola"

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]
research = [
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]
market-data = [
    "databento",
    "pyarrow>=14",
    "exchange-calendars>=4.5,<5",
    "requests>=2.31",
    "openpyxl>=3.1",
]
notebooks = [
    "matplotlib>=3.8",
    "nbformat>=5.9",
    "nbclient>=0.9",
    "nbconvert>=7,<8",
    "ipykernel>=6",
    "jupyter-client>=8",
]
# Retain the previous extra name for existing research instructions.
pricing-demos = [
    "matplotlib>=3.8",
    "nbformat>=5.9",
    "nbclient>=0.9",
    "nbconvert>=7,<8",
    "ipykernel>=6",
    "jupyter-client>=8",
]
excel = ["openpyxl>=3.1", "xlrd>=2.0"]
performance = ["polars>=0.20"]
boosting = ["xgboost>=2", "lightgbm>=4", "catboost>=1.2"]
dev = ["pytest>=7", "build>=1"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["rvlab*", "roughvol*"]

[tool.setuptools.package-data]
"rvlab.tests" = ["fixtures/*.json", "fixtures/*.npz", "fixtures/*.py"]

[tool.pytest.ini_options]
testpaths = ["src/rvlab/tests", "tests"]
markers = [
    "archive: original report-edition checks requiring historical notebooks or payloads omitted from the public source tree; opt in with --run-archive-tests",
]
filterwarnings = [
    "ignore:.*generic.*unit for NumPy timedelta.*:DeprecationWarning",
    "ignore:.*utcfromtimestamp.*:DeprecationWarning",
]
